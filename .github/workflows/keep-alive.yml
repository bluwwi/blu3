name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows you to run it manually if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -f https://blu3-server.onrender.com/health || exit 1
