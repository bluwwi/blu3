<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blu3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #080808;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .logo-container {
      position: relative;
      margin-bottom: 48px;
    }

    .logo-text {
      font-size: 56px;
      font-weight: 600;
      background: linear-gradient(135deg, #3b82f6, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    .status-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 16px;
      min-height: 18px;
      transition: opacity 0.3s ease;
    }

    .progress-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .progress-container.visible {
      opacity: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-bar.indeterminate {
      width: 30%;
      animation: indeterminate 1.5s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(733%); }
    }

    .version {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-glow"></div>
    <div class="logo-text">blu3</div>
  </div>
  <div class="status-text" id="status">Checking for updates...</div>
  <div class="progress-container" id="progressContainer">
    <div class="progress-bar indeterminate" id="progressBar"></div>
  </div>
  <div class="version" id="version"></div>

  <script>
    const { ipcRenderer } = require("electron");

    const statusEl = document.getElementById("status");
    const progressContainer = document.getElementById("progressContainer");
    const progressBar = document.getElementById("progressBar");
    const versionEl = document.getElementById("version");

    ipcRenderer.on("update-status", (_, message) => {
      statusEl.textContent = message;
    });

    ipcRenderer.on("update-progress", (_, percent) => {
      progressContainer.classList.add("visible");
      progressBar.classList.remove("indeterminate");
      progressBar.style.width = percent + "%";
    });

    ipcRenderer.on("update-checking", () => {
      statusEl.textContent = "Checking for updates...";
      progressContainer.classList.add("visible");
      progressBar.classList.add("indeterminate");
      progressBar.style.width = "30%";
    });

    ipcRenderer.on("app-version", (_, ver) => {
      versionEl.textContent = "v" + ver;
    });
  </script>
</body>
</html>
